# Dependencies allowed to run install scripts (pnpm blocks them by default).
# esbuild and @swc/core download their native binaries; @parcel/watcher
# builds the file watcher used by the dev server.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true

# Only install package versions published at least a day ago (same rule as
# pnpm 11's default), so a freshly hijacked release can't slip in.
minimumReleaseAge: 1440
